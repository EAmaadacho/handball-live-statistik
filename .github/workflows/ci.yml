name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Generate code from api.yaml
        run: ./generate_code.sh

      - name: Server – analyze
        working-directory: server_application
        run: dart analyze --fatal-infos

      - name: Server – test
        working-directory: server_application
        run: dart test

      - name: Client – analyze
        working-directory: flutter_application
        run: flutter analyze

      - name: Client – test
        working-directory: flutter_application
        run: flutter test
