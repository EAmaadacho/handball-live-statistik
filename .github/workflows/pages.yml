# Puts the app in demo mode (no server) on GitHub Pages, e.g. to try it
# on a phone: https://eamaadacho.github.io/handball-live-statistik/
#
# Once in the repository settings: Pages → Source → "GitHub Actions".
name: Demo auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Generate code from api.yaml
        run: ./generate_code.sh

      # Without SERVER_URL the app runs the demo (main.dart).
      - name: Build web app
        working-directory: flutter_application
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href /handball-live-statistik/
          # Links like /spiel/17/live are no files: Pages answers them
          # with 404.html, which is the app itself.
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_application/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
