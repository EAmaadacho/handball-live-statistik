openapi: 3.0.0
servers:
  - url: 'http://localhost:8080'
info:
  description: >-
    REST API of the Handball-Live-Statistik server.
  version: 0.1.0
  title: Handball-Live-Statistik API
tags:
  - name: health
    description: Is the server up?
  - name: teams
    description: Teams and their squads (T1, T2)
  - name: games
    description: Games, links, match reports and lineups (S1, E5.1)
  - name: clock
    description: The game clock, kept on the server (U1–U5, ADR-003)
  - name: events
    description: Events and substitutions during the game (E1, E2, E5)
paths:
  /health:
    get:
      tags:
        - health
      summary: Tells whether the server is running
      operationId: getHealth
      responses:
        '200':
          description: The server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /teams:
    post:
      tags:
        - teams
      summary: Creates a team and returns its secret code once (T1)
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTeam'
      responses:
        '201':
          description: The new team with its secret code for the team link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTeam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags:
        - teams
      summary: Returns a team with its squad, without the secret code
      operationId: getTeam
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{teamId}/players:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamCode'
    post:
      tags:
        - teams
      summary: Adds a player to the squad (T2, T2.1)
      operationId: addPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerData'
      responses:
        '201':
          description: The team with the new player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /teams/{teamId}/players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamCode'
      - name: playerId
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - teams
      summary: Changes a player of the squad; the id stays (T2)
      operationId: updatePlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerData'
      responses:
        '200':
          description: The team with the changed player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
    delete:
      tags:
        - teams
      summary: Removes a player from the squad; old games keep him (T2)
      operationId: removePlayer
      responses:
        '200':
          description: The team without the player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /teams/{teamId}/games:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamCode'
    post:
      tags:
        - games
      summary: Creates a game and returns the ticker code once (S1, S1.2)
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGame'
      responses:
        '201':
          description: The new game; its id is the viewer link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameWithCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
    get:
      tags:
        - games
      summary: All games of the team with status and links (S1.3)
      operationId: getTeamGames
      responses:
        '200':
          description: The games, ordered by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameWithCode'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags:
        - games
      summary: A game with both match reports, for everyone (viewer link)
      description: >-
        The live view asks every second with the version it knows (ADR-002).
        If nothing changed since, the answer is 204 without content.
      operationId: getGame
      parameters:
        - name: version
          in: query
          required: false
          description: The version the live view already shows
          schema:
            type: integer
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '204':
          description: Nothing changed since this version
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{gameId}/ticker-access:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    get:
      tags:
        - games
      summary: Checks the ticker link when it is opened (S1.2)
      operationId: checkTickerAccess
      responses:
        '204':
          description: The ticker code is right
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /games/{gameId}/match-report/home:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - games
      summary: Adds a player of the home squad to the match report (S1.4)
      operationId: addHomePlayerToMatchReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquadPlayerRef'
      responses:
        '201':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/match-report/away:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - games
      summary: Adds a new player to the opponent's game squad (S1.1, S1.4)
      operationId: addAwayPlayerToMatchReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerData'
      responses:
        '201':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/match-report/{side}/{playerId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
      - name: side
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Side'
      - name: playerId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - games
      summary: Takes a player out of the match report before kick-off (S1.4)
      operationId: removeFromMatchReport
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/lineups/{side}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
      - name: side
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Side'
    put:
      tags:
        - games
      summary: Sets the starting lineup of one team before kick-off (E5.1)
      operationId: setLineup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLineup'
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/clock:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    put:
      tags:
        - clock
      summary: Corrects the stopped clock, e.g. 23:14 back to 23:05 (U2)
      operationId: adjustClock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockTime'
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/clock/start:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - clock
      summary: Kick-off, or lets the stopped clock run again (U1, U1.1)
      operationId: startClock
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/clock/stop:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - clock
      summary: Stops the clock, e.g. for an injury (U1.1)
      operationId: stopClock
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/clock/half-time:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - clock
      summary: Ends the first half, the clock shows 30:00 (U5.1)
      operationId: halfTime
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/clock/end:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - clock
      summary: Ends the game (U5.2)
      operationId: endGame
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/events:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - events
      summary: Records an event at the server game time, e.g. a goal of Max (E1, R1–R7)
      operationId: recordEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEvent'
      responses:
        '201':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/events/{number}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
      - name: number
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
        - events
      summary: Deletes an event after a typing mistake; the number is never given out again (E2)
      operationId: deleteEvent
      responses:
        '200':
          $ref: '#/components/responses/GameChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/substitutions:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - events
      summary: Swaps a player on the field for one from the bench (E5.2, E5.3)
      operationId: substitute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Substitution'
      responses:
        '201':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/come-on:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - events
      summary: Brings a player onto a free place, e.g. after a penalty (E5.4, R7)
      operationId: comeOn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComeOn'
      responses:
        '201':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
  /games/{gameId}/into-goal:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TickerCode'
    post:
      tags:
        - events
      summary: Moves a field player on the field into the empty goal (E5.7)
      operationId: putInGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntoGoal'
      responses:
        '201':
          $ref: '#/components/responses/GameChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RuleViolation'
components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      description: The id of the game, also the public viewer link (S1.2)
      schema:
        type: string
    TickerCode:
      name: X-Ticker-Code
      in: header
      required: true
      description: The secret code from the ticker link (S1.2, ADR-005)
      schema:
        type: string
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    TeamCode:
      name: X-Team-Code
      in: header
      required: true
      description: The secret code from the team link (T1.2, ADR-005)
      schema:
        type: string
  responses:
    GameChanged:
      description: The game after the change
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Game'
    BadRequest:
      description: The request body is not valid JSON or misses a field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The team code or ticker code is missing or wrong (T1.2, S1.2)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: There is no team or game with this id (an unknown player gives 409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RuleViolation:
      description: A rule rejects the change, the message says why in German
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      description: 'State of the server, for example status ok'
      type: object
      required:
        - status
      properties:
        status:
          type: string
    Error:
      description: 'A German message for the user, e.g. "Die Nummer 7 ist schon vergeben."'
      type: object
      required:
        - message
      properties:
        message:
          type: string
    AgeGroup:
      description: The age group as in nuLiga, e.g. men = "Männer", femaleB = "weibliche Jugend B"
      type: string
      enum:
        - men
        - women
        - maleA
        - maleB
        - maleC
        - maleD
        - maleE
        - femaleA
        - femaleB
        - femaleC
        - femaleD
        - femaleE
        - mixedE
        - mixedF
    TeamName:
      description: Club, age group and team number, e.g. TV Mettmann, men, 2 = "TV Mettmann Männer II"
      type: object
      required:
        - club
        - ageGroup
        - teamNumber
      properties:
        club:
          type: string
        ageGroup:
          $ref: '#/components/schemas/AgeGroup'
        teamNumber:
          type: integer
          minimum: 1
          maximum: 9
    NewTeam:
      description: What the team manager enters to create a team (T1)
      type: object
      required:
        - name
        - shortCode
      properties:
        name:
          $ref: '#/components/schemas/TeamName'
        shortCode:
          type: string
          description: 2 to 4 characters, e.g. TVM
    Position:
      type: string
      enum:
        - fieldPlayer
        - goalkeeper
    PlayerData:
      description: What the team manager enters for a player, e.g. 7 Max Mustermann
      type: object
      required:
        - number
        - firstName
        - lastName
        - position
      properties:
        number:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        position:
          $ref: '#/components/schemas/Position'
    Player:
      type: object
      required:
        - id
        - number
        - firstName
        - lastName
        - position
      properties:
        id:
          type: string
        number:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        position:
          $ref: '#/components/schemas/Position'
    Team:
      description: A team with its squad, as everyone may read it (without the code)
      type: object
      required:
        - id
        - name
        - displayName
        - shortCode
        - players
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/TeamName'
        displayName:
          type: string
          description: e.g. "TV Mettmann Männer II"
        shortCode:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    CreatedTeam:
      description: The new team and its secret code; the code is only sent here (T1.2)
      type: object
      required:
        - team
        - code
      properties:
        team:
          $ref: '#/components/schemas/Team'
        code:
          type: string
    Side:
      type: string
      enum:
        - home
        - away
    GameStatus:
      description: planned before kick-off, running until the end, then finished (S1.3)
      type: string
      enum:
        - planned
        - running
        - finished
    Opponent:
      description: The opponent, entered like a team, with its own game squad (S1.1)
      type: object
      required:
        - name
        - shortCode
        - players
      properties:
        name:
          $ref: '#/components/schemas/TeamName'
        shortCode:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerData'
    NewGame:
      description: What the team manager enters to create a game (S1)
      type: object
      required:
        - opponent
        - date
      properties:
        opponent:
          $ref: '#/components/schemas/Opponent'
        date:
          type: string
          format: date-time
        halfLengthMinutes:
          type: integer
          default: 30
          description: e.g. 25 for a B-Jugend game
    GameTeam:
      description: A team in one game with its match report (at most 16 players, S1.4)
      type: object
      required:
        - name
        - displayName
        - shortCode
        - players
      properties:
        name:
          $ref: '#/components/schemas/TeamName'
        displayName:
          type: string
        shortCode:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    Game:
      type: object
      required:
        - id
        - version
        - homeTeamId
        - date
        - halfLengthMinutes
        - status
        - home
        - away
        - clock
        - score
        - halfTimeScore
        - events
        - runningPenalties
      properties:
        id:
          type: string
        version:
          description: Counts every change of the game, not the running clock (ADR-002)
          type: integer
        homeTeamId:
          description: To read the squad of the home team, e.g. for a player who arrives late (S1.4)
          type: string
        date:
          type: string
          format: date-time
        halfLengthMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/GameStatus'
        home:
          $ref: '#/components/schemas/GameTeam'
        away:
          $ref: '#/components/schemas/GameTeam'
        clock:
          $ref: '#/components/schemas/Clock'
        homeLineup:
          $ref: '#/components/schemas/Lineup'
        awayLineup:
          $ref: '#/components/schemas/Lineup'
        score:
          $ref: '#/components/schemas/Score'
        halfTimeScore:
          $ref: '#/components/schemas/Score'
        events:
          description: Without substitutions, they are not shown (E5.3)
          type: array
          items:
            $ref: '#/components/schemas/Event'
        runningPenalties:
          type: array
          items:
            $ref: '#/components/schemas/RunningPenalty'
    GameWithCode:
      description: A game with the secret ticker code, only for the team manager (S1.2, S1.3)
      type: object
      required:
        - game
        - tickerCode
      properties:
        game:
          $ref: '#/components/schemas/Game'
        tickerCode:
          type: string
    SquadPlayerRef:
      description: A player of the home team's squad, by id
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: string
    ClockPhase:
      type: string
      enum:
        - notStarted
        - firstHalf
        - halfTime
        - secondHalf
        - finished
    Clock:
      description: The clock at the moment of the answer; while it runs, the client counts on by itself (ADR-003)
      type: object
      required:
        - phase
        - running
        - gameTimeSeconds
      properties:
        phase:
          $ref: '#/components/schemas/ClockPhase'
        running:
          type: boolean
        gameTimeSeconds:
          type: integer
          description: e.g. 1394 for 23:14
    ClockTime:
      type: object
      required:
        - gameTimeSeconds
      properties:
        gameTimeSeconds:
          type: integer
    Lineup:
      description: Who stands on the field right now; no goalkeeperId means an empty goal (E1.5)
      type: object
      required:
        - fieldPlayerIds
      properties:
        goalkeeperId:
          type: string
          nullable: true
        fieldPlayerIds:
          type: array
          items:
            type: string
    NewLineup:
      description: The starting lineup, any player may start in goal (E5.1, E5.7)
      type: object
      required:
        - goalkeeperId
        - fieldPlayerIds
      properties:
        goalkeeperId:
          type: string
        fieldPlayerIds:
          type: array
          items:
            type: string
    EventType:
      type: string
      enum:
        - goal
        - miss
        - save
        - sevenMeterGoal
        - sevenMeterMiss
        - twoMinutes
        - yellowCard
        - redCard
        - technicalFault
        - timeout
    NewEvent:
      description: 'e.g. {type: goal, side: home, playerId: <Max>}; a save is recorded on the shooter (E1.3), a timeout has no player'
      type: object
      required:
        - type
        - side
      properties:
        type:
          $ref: '#/components/schemas/EventType'
        side:
          $ref: '#/components/schemas/Side'
        playerId:
          type: string
        leavingPlayerId:
          type: string
          description: For a penalty of a player on the bench, the field player who goes off (E5.4)
    Event:
      type: object
      required:
        - number
        - type
        - side
        - gameTimeSeconds
        - half
      properties:
        number:
          type: integer
        type:
          $ref: '#/components/schemas/EventType'
        side:
          $ref: '#/components/schemas/Side'
        playerId:
          type: string
          nullable: true
        leavingPlayerId:
          type: string
          nullable: true
        goalkeeperId:
          type: string
          nullable: true
          description: The goalkeeper in the opposing goal for goals and saves (E1.2)
        gameTimeSeconds:
          type: integer
        half:
          type: integer
    Score:
      type: object
      required:
        - home
        - away
      properties:
        home:
          type: integer
        away:
          type: integer
    RunningPenalty:
      description: e.g. Max, 23 seconds left (L3)
      type: object
      required:
        - side
        - playerId
        - remainingSeconds
      properties:
        side:
          $ref: '#/components/schemas/Side'
        playerId:
          type: string
        remainingSeconds:
          type: integer
    Substitution:
      type: object
      required:
        - side
        - outId
        - inId
      properties:
        side:
          $ref: '#/components/schemas/Side'
        outId:
          type: string
        inId:
          type: string
        intoGoal:
          type: boolean
          description: Whether the incoming player goes into the free goal; without it a goalkeeper of the squad does (E5.6, E5.7)
    ComeOn:
      type: object
      required:
        - side
        - playerId
      properties:
        side:
          $ref: '#/components/schemas/Side'
        playerId:
          type: string
        intoGoal:
          type: boolean
    IntoGoal:
      type: object
      required:
        - side
        - playerId
      properties:
        side:
          $ref: '#/components/schemas/Side'
        playerId:
          type: string
