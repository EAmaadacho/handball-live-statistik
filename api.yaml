openapi: 3.0.0
servers:
  - url: 'http://localhost:8080'
info:
  description: >-
    REST API of the Handball-Live-Statistik server.
  version: 0.1.0
  title: Handball-Live-Statistik API
tags:
  - name: health
    description: Is the server up?
paths:
  /health:
    get:
      tags:
        - health
      summary: Tells whether the server is running
      operationId: getHealth
      responses:
        '200':
          description: The server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      description: 'State of the server, for example status ok'
      type: object
      required:
        - status
      properties:
        status:
          type: string
